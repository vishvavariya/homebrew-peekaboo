name: Auto-bump Peekaboo cask

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify release download URL
        run: python3 -m unittest discover -s tests -v

      - name: Parse latest version from appcast
        id: parse
        run: |
          set -euo pipefail
          # No appcast until the first release ships: nothing to bump yet.
          if ! curl -fsSL https://getpeekaboo.app/appcast.xml -o appcast.xml; then
            echo "No appcast published yet; skipping." >&2
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pull the first <sparkle:shortVersionString> — Sparkle places newest first.
          LATEST_VERSION=$(grep -oE '<sparkle:shortVersionString>[^<]+' appcast.xml \
            | head -n1 \
            | sed 's|<sparkle:shortVersionString>||')

          if [ -z "$LATEST_VERSION" ]; then
            echo "Could not parse latest version from appcast" >&2
            exit 1
          fi

          CURRENT_VERSION=$(grep -oE 'version "[^"]+"' Casks/peekaboo.rb \
            | head -n1 \
            | sed 's|version "||;s|"||')

          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$LATEST_VERSION" = "$CURRENT_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download zip and compute sha256
        if: steps.parse.outputs.changed == 'true'
        id: hash
        run: |
          set -euo pipefail
          VERSION="${{ steps.parse.outputs.latest }}"
          # Hash the same immutable release asset that the cask installs.
          URL="https://github.com/vishvavariya/peekaboo-releases/releases/download/v${VERSION}/Peekaboo-${VERSION}.zip"

          curl -fsSL "$URL" -o "peekaboo.zip"
          SHA=$(shasum -a 256 peekaboo.zip | awk '{print $1}')

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update Casks/peekaboo.rb
        if: steps.parse.outputs.changed == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.parse.outputs.latest }}"
          SHA="${{ steps.hash.outputs.sha }}"

          sed -i -E "s|version \"[^\"]+\"|version \"${VERSION}\"|" Casks/peekaboo.rb
          sed -i -E "s|sha256 \"[a-f0-9]{64}\"|sha256 \"${SHA}\"|" Casks/peekaboo.rb

      - name: Commit and push
        if: steps.parse.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/peekaboo.rb
          git commit -m "Bump Peekaboo to ${{ steps.parse.outputs.latest }}"
          git push
